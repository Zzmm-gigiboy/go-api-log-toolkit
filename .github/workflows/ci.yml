name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet and Test go-link-api
        run: |
          cd go-link-api
          go vet ./...
          go test -v -race ./...
      - name: Vet and Test go-log-insights
        run: |
          cd go-log-insights
          go vet ./...
          go test -v -race ./...
